name: Update widget prices
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch prices
        run: |
          python3 << 'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          def get(url):
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/121.0.0.0'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.loads(r.read().decode())
          out={'bitcoin':None,'ethereum':None,'solana':None,'fomo':None,'nasdaq':None,'nasdaq_dir':'flat','updated_at':datetime.now(timezone.utc).isoformat()}
          for id,pair in [('bitcoin','BTC-USD'),('ethereum','ETH-USD'),('solana','SOL-USD')]:
              try:
                  j=get(f'https://api.coinbase.com/v2/prices/{pair}/spot')
                  out[id]=float(j['data']['amount'])
              except Exception as e:
                  print('cb',id,e)
          if not out['bitcoin']:
              try:
                  j=get('https://api.kraken.com/0/public/Ticker?pair=XBTUSD,ETHUSD,SOLUSD')
                  for k,v in j.get('result',{}).items():
                      px=float(v['c'][0]); u=k.upper()
                      if 'XBT' in u or 'BTC' in u: out['bitcoin']=px
                      elif 'ETH' in u: out['ethereum']=px
                      elif 'SOL' in u: out['solana']=px
              except Exception as e:
                  print('kr',e)
          try:
              j=get('https://api.alternative.me/fng/?limit=1')
              out['fomo']=j['data'][0]['value']
          except Exception as e:
              print('fng',e)
          try:
              j=get('https://query1.finance.yahoo.com/v8/finance/chart/%5EIXIC?interval=1m&range=1d')
              meta=j['chart']['result'][0]['meta']
              price=meta.get('regularMarketPrice') or meta.get('previousClose')
              prev=meta.get('chartPreviousClose') or meta.get('previousClose')
              if price and prev:
                  pct=(price-prev)/prev*100.0
                  arrow='▲' if pct>0.05 else ('▼' if pct<-0.05 else '•')
                  out['nasdaq']=f"{price:,.2f}  {arrow} {pct:+.2f}%"
                  out['nasdaq_dir']='up' if pct>0.05 else ('down' if pct<-0.05 else 'flat')
          except Exception as e:
              print('ndx',e)
          open('data/widget-prices.json','w').write(json.dumps(out, indent=2)+'\n')
          print(out)
          PY
      - name: Commit
        run: |
          git config user.name "atrader-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/widget-prices.json
          git diff --staged --quiet || git commit -m "chore: refresh widget-prices.json"
          git push
