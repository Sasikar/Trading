name: Refresh US week calendar
on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-us-week.yml'
permissions:
  contents: write
concurrency:
  group: refresh-us-week
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch this week's calendar
        run: |
          curl --fail --retry 5 --retry-delay 3 -A 'Mozilla/5.0' -o us-week.json https://nfs.faireconomy.media/ff_calendar_thisweek.json
          python3 -c "import json; d=json.load(open('us-week.json')); assert isinstance(d, list) and len(d)>0"
      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us-week.json
          if git diff --cached --quiet; then echo "No calendar changes."; else git commit -m "Refresh US week calendar"; git pull --rebase; git push; fi
