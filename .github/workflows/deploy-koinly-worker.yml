name: Deploy Koinly Worker

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "cloudflare/koinly-worker/**"
      - ".github/workflows/deploy-koinly-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/koinly-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/koinly-worker/package.json

      - name: Install dependencies
        run: npm install

      - name: Resolve D1 database ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          D1_ID=$(npx wrangler d1 list --json | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const rows=JSON.parse(s);
              const db=rows.find(x=>x.name==="trading-koinly");
              if(!db) process.exit(2);
              process.stdout.write(db.uuid || db.database_id || "");
            });
          ')
          test -n "$D1_ID"
          sed -i "s/REPLACE_AFTER_D1_CREATE/$D1_ID/" wrangler.jsonc
          echo "Resolved D1 database ID."

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute trading-koinly --remote --file=schema.sql

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set Koinly access secret
        if: ${{ secrets.KOINLY_ACCESS_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KOINLY_ACCESS_KEY: ${{ secrets.KOINLY_ACCESS_KEY }}
        run: printf '%s' "$KOINLY_ACCESS_KEY" | npx wrangler secret put KOINLY_ACCESS_KEY
