name: Deploy Koinly Worker

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "cloudflare/koinly-worker/**"
      - ".github/workflows/deploy-koinly-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/koinly-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4.33.0

      - name: Resolve D1 database ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          D1_ID="$(wrangler d1 list --json | node -e '
            let s="";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const rows = JSON.parse(s);
              const db = rows.find(x => x.name === "trading-koinly");
              if (!db) { console.error("D1 database trading-koinly was not found"); process.exit(2); }
              process.stdout.write(db.uuid || db.database_id || "");
            });
          ')"
          test -n "$D1_ID" || { echo "Could not resolve D1 database ID"; exit 1; }
          sed -i "s/REPLACE_AFTER_D1_CREATE/$D1_ID/" wrangler.jsonc
          echo "D1 database resolved."

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute trading-koinly --remote --file=schema.sql

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Verify Worker deployment
        run: echo "Worker deployment command completed successfully."