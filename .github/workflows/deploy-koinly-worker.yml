name: Deploy Koinly Worker

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "cloudflare/koinly-worker/**"
      - ".github/workflows/deploy-koinly-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/koinly-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/koinly-worker/package.json

      - name: Install Worker dependencies
        run: |
          set -euxo pipefail
          npm install --no-fund --no-audit
          npx wrangler --version
          node -e "console.log('Playwright:', require('./node_modules/@cloudflare/playwright/package.json').version)"
          node -e "console.log('Workers types:', require('./node_modules/@cloudflare/workers-types/package.json').version)"

      - name: Resolve D1 database ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euxo pipefail
          D1_ID="$(npx wrangler d1 list --json | node -e '
            let s="";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const parsed = JSON.parse(s);
              const rows = Array.isArray(parsed) ? parsed : (parsed.result || parsed.databases || []);
              const db = rows.find(x => x.name === "trading-koinly");
              if (!db) {
                console.error("D1 database trading-koinly was not found");
                process.exit(2);
              }
              process.stdout.write(db.uuid || db.database_id || "");
            });
          ')"
          test -n "$D1_ID"
          echo "Resolved D1 database: $D1_ID"
          sed -i "s/REPLACE_AFTER_D1_CREATE/$D1_ID/" wrangler.jsonc
          echo "Effective Wrangler config:"
          cat wrangler.jsonc

      - name: Generate Worker types
        run: npx wrangler types

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute trading-koinly --remote --file=schema.sql

      - name: Validate Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify Worker deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list
