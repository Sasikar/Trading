name: Install universal trading navigation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add navigation script to every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              tag = '<script src="site-nav.js"></script>'
              if tag not in text:
                  marker = '</body>'
                  if marker in text:
                      text = text.replace(marker, f'  {tag}\n{marker}', 1)
                  else:
                      text += f'\n{tag}\n'
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit navigation updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No navigation changes needed."
          else
            git commit -m "Add universal navigation to all pages"
            git push
          fi
