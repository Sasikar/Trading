name: Install universal trading navigation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add navigation script to every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              has_nav = 'site-nav.js' in text
              if not has_nav:
                  marker = '</body>'
                  tag = '<script src="site-nav.js?v=20260825-final"></script>'
                  if marker in text:
                      text = text.replace(marker, f'  {tag}\n{marker}', 1)
                  else:
                      text += f'\n{tag}\n'
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Remove homepage hero copy but preserve live BTC/ETH market grid
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # Remove only the left-side "Personal trading operating system" hero copy.
          # Keep the terminal intact because it contains the live BTC/ETH prices,
          # change indicators and Fear & Greed/FOMO market data.
          start = text.find('<section class="hero"><div>')
          aside = text.find('<aside class="terminal">', start)
          if start != -1 and aside != -1:
              text = text[:start] + '<section class="hero">' + text[aside:]

          # With the copy removed, let the preserved market grid use the full width.
          text = text.replace(
              '.hero{padding:70px 0 28px;display:grid;grid-template-columns:1.05fr .95fr;gap:22px}',
              '.hero{padding:42px 0 28px;display:grid;grid-template-columns:1fr;gap:22px}'
          )

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('Removed homepage hero copy; preserved live BTC/ETH market grid.')
          else:
              print('No homepage hero change needed.')
          PY

      - name: Commit navigation and homepage updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No navigation or homepage changes needed."
          else
            git commit -m "Remove homepage hero copy and preserve market grid"
            git push
          fi
