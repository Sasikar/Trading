name: Deploy OHLCV Worker (API only, no login)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "cloudflare/ohlcv-worker/**"
      - ".github/workflows/deploy-ohlcv-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/ohlcv-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-fund --no-audit

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify health (public, no login)
        run: |
          set -euxo pipefail
          sleep 3
          curl --fail --show-error --retry 8 --retry-delay 3 https://trading-ohlcv.sasipudi.workers.dev/health
          curl --fail --show-error https://trading-ohlcv.sasipudi.workers.dev/status
          # Must NOT be a login page
          body="$(curl -sS https://trading-ohlcv.sasipudi.workers.dev/health)"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -viq 'Private access'
          echo "$body" | grep -viq '__login'
