name: Breakout meme alerts (ntfy) — DISABLED

# Replaced by Cloudflare OHLCV worker (trading-ohlcv.sasipudi.workers.dev).
# Kept as manual-only so it cannot duplicate ntfy.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skipped:
    runs-on: ubuntu-latest
    steps:
      - name: Disabled
        run: |
          echo "This scanner is retired. Alerts now come from the OHLCV worker."
          echo "https://trading-ohlcv.sasipudi.workers.dev/status"
