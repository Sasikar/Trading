name: Breakout meme alerts (ntfy)

# DexScreener-only. Publishes scan JSON + ntfy. Does not deploy the site.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan saved CAs + ntfy (DexScreener)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BREAKOUT_TFS: '4h,1d'
        run: |
          set -e
          export NTFY_TOPIC="${NTFY_TOPIC:-MyTradingMemeBreakout44}"
          echo "breakout PASS · topic=$NTFY_TOPIC · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/breakout-alert.mjs
