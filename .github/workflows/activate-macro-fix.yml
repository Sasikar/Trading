name: Activate Macro timeframe fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch overview loader to Macro-fixed loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="overview-app.js?v=20260905-macro1"></script>'
          new='<script src="macro-timeframe-fix.js?v=20260905-macrofix1"></script>'
          if old in s and new not in s:
              p.write_text(s.replace(old,new))
          PY
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Activate true Macro timeframe construction'
          git push
