name: Refresh ETF flows + NASDAQ snapshot
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-etf-flows.yml'
      - 'scripts/refresh_etf_flows.py'
permissions:
  contents: write
concurrency:
  group: refresh-etf-flows
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install --disable-pip-version-check pandas lxml requests
      - name: Fetch BTC ETF flow history
        run: python scripts/refresh_etf_flows.py

      - name: Refresh NASDAQ snapshot
        run: |
          python - <<'PY'
          import json, urllib.request, time
          url='https://query1.finance.yahoo.com/v8/finance/chart/%5EIXIC?interval=1d&range=5d'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          j=json.load(urllib.request.urlopen(req, timeout=20))
          meta=j['chart']['result'][0]['meta']
          closes=[c for c in j['chart']['result'][0]['indicators']['quote'][0]['close'] if c is not None]
          price=float(meta['regularMarketPrice'])
          prev=meta.get('previousClose') or meta.get('chartPreviousClose')
          if len(closes)>=2: prev=float(closes[-2])
          else: prev=float(prev or price)
          chg=price-prev
          pct=(chg/prev)*100 if prev else 0
          out={'symbol':'^IXIC','name':'NASDAQ','price':price,'chg':chg,'pct':pct,'updated':time.time()*1000,'source':'yahoo'}
          json.dump(out, open('nasdaq.json','w'), indent=2)
          print(out)
          PY
      - name: Commit updated data

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf-flows.json nasdaq.json
          if git diff --cached --quiet; then echo "No ETF flow changes."; else git commit -m "Refresh ETF flows + NASDAQ snapshot"; git pull --rebase; git push; fi
