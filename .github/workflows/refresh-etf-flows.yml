name: Refresh BTC ETF flow data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-etf-flows.yml'
      - 'scripts/refresh_etf_flows.py'
permissions:
  contents: write
concurrency:
  group: refresh-etf-flows
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install --disable-pip-version-check pandas lxml requests
      - name: Fetch BTC ETF flow history
        run: python scripts/refresh_etf_flows.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf-flows.json
          if git diff --cached --quiet; then echo "No ETF flow changes."; else git commit -m "Refresh BTC ETF flow data"; git pull --rebase; git push; fi
