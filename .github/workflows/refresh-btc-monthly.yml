name: Refresh BTC monthly (Pages static data)
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build monthly OHLC from Bitstamp daily (UTC calendar)
        run: |
          python3 << 'PY'
          import json, urllib.request, time, os
          from datetime import datetime, timezone
          def fetch_bs(start_ts):
              url=f'https://www.bitstamp.net/api/v2/ohlc/btcusd/?step=86400&limit=1000&start={int(start_ts)}'
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)['data']['ohlc']
          all_days={}
          start=1514764800
          for _ in range(10):
              rows=fetch_bs(start)
              if not rows: break
              for row in rows:
                  all_days[int(row['timestamp'])]=row
              last=int(rows[-1]['timestamp'])
              if last >= int(datetime.now(timezone.utc).timestamp())-86400:
                  break
              start=last+86400
              time.sleep(0.3)
          monthly={}
          for ts in sorted(all_days):
              row=all_days[ts]
              d=datetime.fromtimestamp(ts, timezone.utc)
              key=f'{d.year}-{d.month:02d}'
              o,h,l,c=float(row['open']),float(row['high']),float(row['low']),float(row['close'])
              v=float(row.get('volume') or 0)
              if key not in monthly:
                  monthly[key]={'time':key,'ts':ts*1000,'open':o,'high':h,'low':l,'close':c,'volume':v}
              else:
                  m=monthly[key]
                  m['high']=max(m['high'],h); m['low']=min(m['low'],l); m['close']=c; m['volume']+=v
          now=datetime.now(timezone.utc)
          cur=f'{now.year}-{now.month:02d}'
          out=[monthly[k] for k in sorted(monthly) if k<cur and k>='2018-01']
          os.makedirs('data', exist_ok=True)
          path='data/btc-monthly.json'
          new=json.dumps(out, indent=2)+'\n'
          old=open(path).read() if os.path.exists(path) else ''
          if new!=old:
              open(path,'w').write(new)
              print('updated', len(out), out[0]['time'], '→', out[-1]['time'])
          else:
              print('unchanged', len(out))
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/btc-monthly.json
          git diff --staged --quiet || git commit -m "chore: refresh btc-monthly.json from Bitstamp UTC daily"
          git push
