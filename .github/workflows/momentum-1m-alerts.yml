name: 1M Momentum breakout alerts (ntfy)

# Permanent design:
# - Scan uses GITHUB_TOKEN + Contents API to publish data/momentum-1m-state.json
#   (no fragile git commit/push races — UI always gets last scan)
# - GitHub schedule is best-effort; workflow_dispatch for manual
# - Independent of CA frozen engine / 4H breakout-alerts
on:
  schedule:
    # Every 10 min (more reliable than */5 on free tier; still uses 1m candles)
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [momentum-1m-scan]

concurrency:
  group: momentum-1m-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1m momentum passes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 2 passes × ~70s — under GT budget with pool-from-recents
          MOMENTUM_PASSES: '2'
          MOMENTUM_PASS_SLEEP_SEC: '75'
        run: |
          set -e
          if [ -z "$NTFY_TOPIC" ]; then
            echo "WARNING: NTFY_TOPIC secret empty — scan runs, ntfy skipped"
          else
            echo "NTFY_TOPIC is set (value not logged)"
          fi
          PASSES="${MOMENTUM_PASSES:-2}"
          SLEEP_SEC="${MOMENTUM_PASS_SLEEP_SEC:-75}"
          for i in $(seq 1 "$PASSES"); do
            echo "======== PASS $i / $PASSES · $(date -u +%Y-%m-%dT%H:%M:%SZ) ========"
            node scripts/momentum-1m-alert.mjs || echo "pass $i non-fatal error"
            if [ "$i" -lt "$PASSES" ]; then
              echo "sleep ${SLEEP_SEC}s until next pass"
              sleep "$SLEEP_SEC"
            fi
          done
          echo "Done. State should be on data/momentum-1m-state.json via Contents API."
