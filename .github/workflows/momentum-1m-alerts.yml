name: 1M Momentum breakout alerts (ntfy) — DISABLED

# Replaced by Cloudflare OHLCV worker focus-1m (off by default).
# Kept as manual-only so it cannot duplicate ntfy.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skipped:
    runs-on: ubuntu-latest
    steps:
      - name: Disabled
        run: |
          echo "This scanner is retired. 1m alerts are focus-only on the OHLCV worker."
          echo "https://trading-ohlcv.sasipudi.workers.dev/status"
