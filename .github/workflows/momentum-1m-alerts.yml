name: 1M Momentum breakout alerts (ntfy)

# Primary cadence: also runs from update-widget-prices.yml (schedule that actually fires).
# This workflow: manual + backup schedule.
on:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [momentum-1m-scan]

concurrency:
  group: momentum-1m-alerts
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Single 1m pass + Contents API state
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          echo "PASS · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/momentum-1m-alert.mjs
