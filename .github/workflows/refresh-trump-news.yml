name: Refresh market news and Truth posts
on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-trump-news.yml'
      - 'scripts/refresh_news.py'
      - 'scripts/refresh_truths.py'
permissions:
  contents: write
concurrency:
  group: refresh-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch market news
        run: python scripts/refresh_news.py
      - name: Fetch Truth Social posts
        run: python scripts/refresh_truths.py
      - name: Verify freshness
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          for path, key in (('trump-news.json','items'), ('trump-truths.json','items')):
              data=json.load(open(path,encoding='utf-8'))
              items=data.get(key,[])
              print(path,'->',len(items),'items, updated',data.get('updated'))
              if not items: continue
              newest=datetime.fromisoformat(items[0]['time'])
              age=(datetime.now(timezone.utc)-newest).total_seconds()/3600
              print(f'  newest {items[0]["time"]} ({age:.1f}h old)')
              if age > 72: raise SystemExit(f'{path} newest item is older than 72 hours')
          PY
      - name: Commit news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trump-news.json trump-truths.json
          if git diff --cached --quiet; then echo "No news changes."; else git commit -m "Refresh market news and Truth posts"; git pull --rebase; git push; fi
