name: Koinly Live Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and encryption library
        run: |
          python -m pip install --upgrade pip
          pip install playwright cryptography
          playwright install --with-deps chromium

      - name: Scrape Koinly transactions using Google-authenticated session
        id: scrape
        continue-on-error: true
        env:
          KOINLY_STORAGE_STATE_B64: ${{ secrets.KOINLY_STORAGE_STATE_B64 }}
          KOINLY_LOGIN_URL: https://app.koinly.io/login
          KOINLY_TRANSACTIONS_URL: https://app.koinly.io/transactions
        run: |
          python tools/koinly_scraper.py
          echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Write sync status
        run: |
          mkdir -p data
          if [ "${{ steps.scrape.outcome }}" = "success" ]; then
            python - <<'PY'
import json
from datetime import datetime, timezone
p={'status':'ok','synced_at':datetime.now(timezone.utc).isoformat()}
open('data/koinly-sync-status.json','w').write(json.dumps(p))
PY
          else
            python - <<'PY'
import json
from datetime import datetime, timezone
p={'status':'login_required','message':'Koinly Google session expired or authentication is required. Refresh KOINLY_STORAGE_STATE_B64 and run the workflow again.','checked_at':datetime.now(timezone.utc).isoformat()}
open('data/koinly-sync-status.json','w').write(json.dumps(p))
PY
          fi

      - name: Encrypt transaction dataset
        if: steps.scrape.outcome == 'success'
        env:
          KOINLY_DATA_KEY: ${{ secrets.KOINLY_DATA_KEY }}
        run: python tools/koinly_encrypt.py

      - name: Publish sync status and encrypted dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/koinly-sync-status.json
          if [ "${{ steps.scrape.outcome }}" = "success" ]; then git add data/koinly-transactions.enc.json; fi
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Koinly sync status"
            git push
          fi
