name: Koinly Live Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and encryption library
        run: |
          python -m pip install --upgrade pip
          pip install playwright cryptography
          playwright install --with-deps chromium

      - name: Scrape Koinly transactions using Google-authenticated session
        env:
          KOINLY_STORAGE_STATE_B64: ${{ secrets.KOINLY_STORAGE_STATE_B64 }}
          KOINLY_LOGIN_URL: https://app.koinly.io/login
          KOINLY_TRANSACTIONS_URL: https://app.koinly.io/transactions
        run: python tools/koinly_scraper.py

      - name: Encrypt transaction dataset
        env:
          KOINLY_DATA_KEY: ${{ secrets.KOINLY_DATA_KEY }}
        run: python tools/koinly_encrypt.py

      - name: Publish encrypted dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/koinly-transactions.enc.json
          if git diff --cached --quiet; then
            echo "No encrypted dataset changes."
          else
            git commit -m "Update encrypted Koinly transaction sync"
            git push
          fi
