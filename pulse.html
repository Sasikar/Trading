<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>TRADING — Crypto Pulse · Live ETF Flows</title><style>:root{--bg:#000;--panel:#080b0f;--line:#24282d;--text:#f5f7fa;--muted:#7f8791;--green:#35d98a;--red:#ef3f4f;--gold:#f4d35e}*{box-sizing:border-box}html{background:#000;color-scheme:dark}body{margin:0;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(1100px,calc(100% - 28px));margin:auto}.box{margin:24px 0 34px;border:1px solid #24282d;border-radius:22px;background:#080b0f;overflow:hidden;box-shadow:0 18px 55px #000}.head{padding:18px 20px 15px;border-bottom:1px solid #ffffff0d;display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:15px;font-weight:900}.sub{font-size:9px;color:var(--muted);margin-top:4px;line-height:1.5}.live{font-size:8px;font-weight:900;letter-spacing:.12em;color:var(--green);padding:7px 9px;border:1px solid #35d98a33;border-radius:999px;white-space:nowrap}.live.trump{color:#fff;background:#ef3f4f;border-color:#ef3f4f}.chart-wrap{padding:14px}.range{display:flex;gap:7px;align-items:center;padding:0 0 11px}.range button{border:1px solid #ffffff08;background:#05080b;color:#7f8994;border-radius:10px;padding:8px 12px;font-size:9px;font-weight:900}.range button.active{color:#041109;border-color:var(--green);background:var(--green)}.stat{margin-left:auto;font-size:9px;font-weight:900;color:#dfe8ef}.stat b{color:var(--green)}.chart{display:block;width:100%;height:420px;background:#000!important;border:1px solid #24282d;border-radius:16px;overflow:hidden}.foot{padding:11px 16px 15px;border-top:1px solid #ffffff0d;color:#66717d;font-size:8px;line-height:1.5}.foot a{color:var(--green);font-weight:800;text-decoration:none}@media(max-width:650px){.shell{width:calc(100% - 28px)}.head{padding:16px}.chart{height:420px}}</style></head><body><div class="shell"><section class="box" id="trump-news-panel"><div class="head"><div><div class="title">Trump News</div><div class="sub">Market-relevant only · tariffs / Fed / crypto / policy · empty if none</div></div><span class="live trump">TRUMP NEWS</span></div><div id="hi-list" style="padding:12px 14px 16px;max-height:640px;overflow-y:auto"><div style="padding:14px;color:#8f99a4">Loading…</div></div></section><section class="box"><div class="head"><div><div class="title">₿ BTC ETF Flows — Live</div><div class="sub">U.S. spot Bitcoin ETF daily net inflows / outflows · custom native chart.</div></div><span class="live">LIVE DATA</span></div><div class="chart-wrap"><div class="range"><button data-days="30" class="active">30D</button><button data-days="90">90D</button><button data-days="180">180D</button><span class="stat" id="stat">Loading…</span></div><div id="chartMount"></div></div><div class="foot">Native chart — no iframe. Source: <a href="https://farside.co.uk/bitcoin-etf-flow-all-data/" rel="noopener">Farside Investors →</a></div></section></div><script>const seed=[['2026-08-18',189.3],['2026-08-19',517.2],['2026-08-20',606.3],['2026-08-21',307.5],['2026-08-24',337.6]];let all=seed;const fmt=n=>Math.abs(n)>=1000?'$'+(n/1000).toFixed(2)+'B':'$'+Math.round(Math.abs(n))+'M';function draw(days){const rows=all.slice(-days),w=1200,h=420,p={l:58,r:24,t:38,b:50},vals=rows.map(x=>+x[1]),max=Math.max(100,...vals.map(v=>Math.abs(v))),ph=h-p.t-p.b,y0=p.t+ph/2,scale=ph/(2*max),slot=(w-p.l-p.r)/Math.max(rows.length,1),bw=Math.max(9,Math.min(19,slot*.42));let s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><rect width="1200" height="420" rx="16" fill="#000"/>';for(let k=0;k<5;k++){let y=p.t+k*ph/4,val=max-k*max/2;s+='<line x1="'+p.l+'" y1="'+y+'" x2="'+(w-p.r)+'" y2="'+y+'" stroke="#8a939c" stroke-opacity=".20" stroke-width="1"/><text x="8" y="'+(y+4)+'" fill="#a2aab2" font-size="12">'+(val===0?'$0':'$'+Math.round(Math.abs(val))+'M')+'</text>'}s+='<line x1="'+p.l+'" y1="'+y0+'" x2="'+(w-p.r)+'" y2="'+y0+'" stroke="#aab2ba" stroke-opacity=".75" stroke-width="1"/>';rows.forEach((r,i)=>{const v=+r[1],x=p.l+(i+.5)*slot,bh=Math.max(2,Math.abs(v)*scale),y=v>=0?y0-bh:y0,fill=v>=0?'#35d98a':'#ef3f4f';s+='<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="1.5" fill="'+fill+'"></rect>';});const recent=rows.slice(-6).reduce((a,r)=>a+ +r[1],0);s+='</svg>';document.getElementById('chartMount').innerHTML=s;document.getElementById('stat').innerHTML='Last 6D <b>'+(recent>=0?'+':'')+fmt(recent)+'</b>'}function boot(){draw(30);fetch('./etf-flows.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.data)&&j.data.length){all=j.data;draw(+document.querySelector('.range .active').dataset.days)}}).catch(()=>{})}boot();document.querySelectorAll('.range button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.range button').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(+b.dataset.days)});</script><script>(function(){const box=document.getElementById('hi-list');if(!box)return;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));const ago=t=>{const d=new Date(t);if(isNaN(d))return'Latest';const m=Math.max(0,Date.now()-d)/6e4|0;if(m<60)return m+'m ago';const h=m/60|0;if(h<48)return h+'h ago';return(h/24|0)+'d ago'};fetch('./truth-signals.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{const items=(d&&d.items)||[];if(!items.length){box.innerHTML='<div style="padding:28px 12px;text-align:center;color:#8f99a4"><b style="display:block;color:#f5f7fa;font-size:14px;margin-bottom:8px">No Trump news right now</b>Nothing market-relevant in the latest batch.<br><a href="https://truthsocial.com/@realDonaldTrump" rel="noopener" style="color:#62e3a0;font-weight:800;font-size:11px;display:inline-block;margin-top:12px">Open Truth Social →</a></div>';return;}box.innerHTML=items.slice(0,12).map(x=>'<a href="'+esc(x.url)+'" rel="noopener" style="display:block;text-decoration:none;color:#f5f7fa;padding:14px 12px;margin-bottom:8px;border:1px solid #ffffff0c;border-radius:14px;background:#0b1118"><div style="font-size:8px;font-weight:900;color:#72a7ff;letter-spacing:.08em;text-transform:uppercase">'+esc(x.source||'News')+'</div><div style="font-size:15px;font-weight:950;color:#35d98a;margin-top:6px">'+esc(ago(x.time))+'</div><div style="font-size:13px;font-weight:800;line-height:1.4;margin-top:8px">'+esc(x.title)+'</div><div style="font-size:9px;color:#8f99a4;margin-top:6px">'+esc(x.why||'Market-relevant')+'</div></a>').join('');}).catch(()=>{box.innerHTML='<div style="padding:20px;color:#8f99a4;text-align:center">Could not load. <a href="https://truthsocial.com/@realDonaldTrump" style="color:#62e3a0">Truth Social →</a></div>';});})();</script><script src="site-nav.js?v=20260826-trumpnews"></script></body></html>
