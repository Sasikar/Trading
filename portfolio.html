<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRADING · Portfolio</title><style>body{margin:0;background:#070a0f;color:#f4f7fb;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 16px}.card{border:1px solid #263341;border-radius:20px;background:#0c1219;padding:20px;margin-top:20px}.muted{color:#8491a1;font-size:13px}.btn{background:#62e3a0;color:#07100b;border:0;border-radius:10px;padding:11px 15px;font-weight:800}.input{background:#0b1118;color:#fff;border:1px solid #344252;border-radius:10px;padding:11px;width:100%;box-sizing:border-box;margin:10px 0 12px}.err{color:#ff9b61}.table{width:100%;border-collapse:collapse;margin-top:18px;font-size:12px}.table td,.table th{padding:10px;border-bottom:1px solid #ffffff10;text-align:left}.scroll{max-height:600px;overflow:auto}.stat{display:inline-block;margin:6px 8px 6px 0;padding:10px 13px;background:#0b1118;border:1px solid #ffffff10;border-radius:10px}.hide{display:none}</style></head><body><div class="wrap"><h1>Portfolio</h1><div class="muted">Private Koinly transaction view · encrypted at rest</div><div class="card"><label>Portfolio passphrase</label><input id="key" class="input" type="password" autocomplete="off" placeholder="Enter your private data key"><button class="btn" onclick="loadData()">Unlock latest sync</button><div id="status" class="muted"></div></div><div id="dashboard" class="card hide"><div id="stats"></div><div class="scroll"><table class="table"><thead><tr><th>#</th><th>Transaction</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="site-nav.js?v=20260825"></script><script>const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));async function loadData(){const status=document.getElementById('status');status.textContent='Loading encrypted sync…';try{const r=await fetch('data/koinly-transactions.enc.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('No encrypted sync has been published yet.');const e=await r.json();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('key').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.nonce)},key,b64(e.ciphertext));const data=JSON.parse(new TextDecoder().decode(plain));document.getElementById('dashboard').classList.remove('hide');document.getElementById('stats').innerHTML='<span class="stat">Synced: '+new Date(data.synced_at).toLocaleString()+'</span><span class="stat">Rows: '+data.transaction_count+'</span>';document.getElementById('rows').innerHTML=data.transactions.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+escapeHtml(x.raw)+'</td></tr>').join('');status.textContent='Unlocked locally. The passphrase never leaves this browser.';}catch(err){status.innerHTML='<span class="err">'+escapeHtml(err.message||'Unable to unlock')+'</span>';}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}</script></body></html>
