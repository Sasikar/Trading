<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist</title>
<style>
  :root{
    --bg:#0d0e12;
    --card:#15161c;
    --line:#24252c;
    --text:#f2f2f4;
    --dim:#8b8d98;
    --green:#3ecf8e;
    --red:#f2545b;
    --pill:#1d1f27;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:480px;margin:0 auto;padding-bottom:24px;}
  .banner{background:#123425;color:#4ee0a0;font-size:12px;text-align:center;padding:8px 12px;letter-spacing:.02em;}
  header{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px;}
  header .title{font-size:15px;font-weight:600;color:var(--dim);}
  .add-row{display:flex;gap:8px;padding:8px 16px 4px;}
  .add-row input{flex:1;background:var(--pill);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 10px;font-size:13px;min-width:0;}
  .add-row button{background:var(--green);color:#052;border:none;border-radius:8px;padding:0 14px;font-weight:700;font-size:13px;}
  .sort-row{display:flex;gap:6px;padding:4px 16px 8px;flex-wrap:wrap;}
  .sortBtn{background:var(--pill);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:5px 9px;font-size:11px;font-weight:600;}
  .sortBtn.active{color:var(--text);border-color:var(--green);}
  .list{padding:8px 12px;}
  .row{display:flex;flex-direction:column;gap:8px;padding:14px 4px;border-bottom:1px solid var(--line);position:relative;}
  .row:last-child{border-bottom:none;}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .id{display:flex;align-items:center;gap:10px;}
  .icon{width:34px;height:34px;border-radius:50%;background:var(--pill);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden;}
  .icon img{width:100%;height:100%;object-fit:cover;}
  .names .sym{font-weight:700;font-size:16px;}.names .full{font-size:12px;color:var(--dim);margin-top:1px;}
  .price-block{text-align:right;}.price{font-size:17px;font-weight:700;}.deltas{font-size:11px;color:var(--dim);margin-top:2px;}
  .up{color:var(--green);}.down{color:var(--red);}.flat{color:var(--dim);}
  .pills{display:flex;gap:6px;flex-wrap:wrap;}.pill{background:var(--pill);border-radius:8px;padding:5px 9px;font-size:11px;color:var(--dim);}.pill b{color:var(--text);font-weight:600;}
  .remove{position:absolute;top:14px;right:0;color:var(--dim);font-size:16px;background:none;border:none;padding:2px 6px;display:none;}.row:hover .remove{display:block;}
  footer{text-align:center;color:var(--dim);font-size:11px;padding:16px;}.empty{text-align:center;color:var(--dim);font-size:13px;padding:30px 16px;}.stale{opacity:.45;}
  .trades{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-wrap:wrap;gap:8px;font-size:11px;}
  .trade{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}.trade .tag{font-weight:700;}.trade .buy{color:var(--green);}.trade .sell{color:var(--red);}.trade .time{color:var(--dim);}
</style>
</head>
<body>
<div class="banner" id="banner">Live · fetched from DexScreener · auto-refresh 10s</div>
<header><div class="title">Watchlist</div><div class="title" id="lastUpdate">—</div></header>
<div class="add-row"><input id="caInput" placeholder="Paste contract address (0x...)" /><button onclick="addToken()">Add</button></div>
<div class="sort-row" id="sortRow"></div>
<div class="list" id="list"><div class="empty">Loading…</div></div>
<footer id="footerCount"></footer>
<script>
let addresses=["0x68bbed6a47194eff1cf514b50ea91895597fc91e","0x594DaaD7D77592a2b97b725A7AD59D7E188b5bFa","0xE0f63A424a4439cBE457D80E4f4b51aD25b2c56C","2zMMhcVQEXDtdE6vsFS7S7D5oUodfJHE8vd1gnBouauv","DtR4D9FtVoTX2569gaL837ZgrB6wNjj6tkmnX9Rdk9B2","0x95AF4aF910c28E8EcE4512BFE46F1F33687424ce"];
function normalizeAddress(addr){return addr.startsWith("0x")?addr.toLowerCase():addr;}
let sortKey=null,sortDir="desc";
function setSort(key){if(sortKey===key)sortDir=sortDir==="desc"?"asc":"desc";else{sortKey=key;sortDir="desc";}renderSortRow();fetchAll();}
function renderSortRow(){const labels={price:"PRICE",h24:"24H",liq:"LIQ",vol:"VOL",mcap:"MCAP"};const el=document.getElementById("sortRow");if(!el)return;el.innerHTML=Object.keys(labels).map(k=>{const active=sortKey===k;const arrow=active?(sortDir==="desc"?"▼":"▲"):"";return `<button class="sortBtn ${active?"active":""}" onclick="setSort('${k}')">${labels[k]} ${arrow}</button>`;}).join("");}
function fmtMultiplier(v){if(v===undefined||v===null||isNaN(v))return `<span class="flat">–</span>`;const mult=1+v/100;const cls=mult>1?"up":mult<1?"down":"flat";return `<span class="${cls}">${mult.toFixed(2)}x</span>`;}
function fmtDelta(v){if(v===undefined||v===null||isNaN(v))return `<span class="flat">–</span>`;const cls=v>0?"up":v<0?"down":"flat";const sign=v>0?"+":"";return `<span class="${cls}">${sign}${v.toFixed(1)}%</span>`;}
function fmtUsd(n){if(n===undefined||n===null)return "$—";if(n<0.01)return "$"+n.toPrecision(3);if(n<1000)return "$"+n.toFixed(4).replace(/0+$/i,"").replace(/\.$/,"");return "$"+n.toLocaleString(undefined,{maximumFractionDigits:2});}
function fmtCompact(n){if(n===undefined||n===null)return "—";if(n>=1e9)return "$"+(n/1e9).toFixed(2)+"B";if(n>=1e6)return "$"+(n/1e6).toFixed(2)+"M";if(n>=1e3)return "$"+(n/1e3).toFixed(1)+"K";return "$"+n.toFixed(0);}
const CG_PLATFORM={ethereum:"ethereum",bsc:"binance-smart-chain",polygon:"polygon-pos",arbitrum:"arbitrum-one",base:"base",solana:"solana",avalanche:"avalanche"};
async function fetch30dChange(chainId,address){const platform=CG_PLATFORM[chainId];if(!platform)return null;try{const to=Math.floor(Date.now()/1000),from=to-30*24*60*60;const res=await fetch(`https://api.coingecko.com/api/v3/coins/${platform}/contract/${address}/market_chart/range?vs_currency=usd&from=${from}&to=${to}`);if(!res.ok)return null;const data=await res.json(),prices=data.prices;if(!prices||prices.length<2)return null;const priceThen=prices[0][1],priceNow=prices[prices.length-1][1];if(!priceThen)return null;return((priceNow-priceThen)/priceThen)*100;}catch(e){return null;}}
const d30Cache={},D30_REFRESH_MS=5*60*1000;let cgQueue=Promise.resolve();const CG_SPACING_MS=2500;
function queueCgCall(fn){const result=cgQueue.then(()=>fn());cgQueue=result.catch(()=>{}).then(()=>new Promise(r=>setTimeout(r,CG_SPACING_MS)));return result;}
async function get30dChange(chainId,address){const cached=d30Cache[address],now=Date.now();if(cached&&(now-cached.fetchedAt)<D30_REFRESH_MS)return cached.value;const value=await queueCgCall(()=>fetch30dChange(chainId,address));if(value!==null||!cached)d30Cache[address]={value,fetchedAt:now};else d30Cache[address].fetchedAt=now;return d30Cache[address].value;}
const GT_NETWORK={ethereum:"eth",bsc:"bsc",polygon:"polygon_pos",arbitrum:"arbitrum",base:"base",solana:"solana",avalanche:"avax"};
const tradesCache={},TRADES_REFRESH_MS=30*1000;
async function getBigTrades(chainId,pairAddress){const cached=tradesCache[pairAddress],now=Date.now();if(cached&&(now-cached.fetchedAt)<TRADES_REFRESH_MS)return cached.value;const network=GT_NETWORK[chainId];if(!network)return null;try{const res=await fetch(`https://api.geckoterminal.com/api/v2/networks/${network}/pools/${pairAddress}/trades`);if(!res.ok)throw new Error("bad response");const data=await res.json();const rows=(data.data||[]).map(t=>({kind:t.attributes.kind,usd:parseFloat(t.attributes.volume_in_usd),time:new Date(t.attributes.block_timestamp)}));
// Keep the three largest trades, but show the newest first so the latest BUY/SELL is always at the beginning.
const top3=rows.sort((a,b)=>b.usd-a.usd).slice(0,3).sort((a,b)=>b.time-a.time);
tradesCache[pairAddress]={value:top3,fetchedAt:now};return top3;}catch(e){if(cached){cached.fetchedAt=now;return cached.value;}return null;}}
function timeAgo(date){const secs=Math.floor((Date.now()-date.getTime())/1000);if(secs<60)return secs+"s ago";if(secs<3600)return Math.floor(secs/60)+"m ago";return Math.floor(secs/3600)+"h ago";}
function renderTrades(trades){if(!trades||trades.length===0)return "";const rows=trades.map(t=>`<span class="trade"><span class="tag ${t.kind}">${t.kind.toUpperCase()}</span>$${t.usd.toLocaleString(undefined,{maximumFractionDigits:0})}<span class="time">${timeAgo(t.time)}</span></span>`).join("");return `<div class="trades">${rows}</div>`;}
function addToken(){const el=document.getElementById("caInput"),val=normalizeAddress(el.value.trim());if(!val)return;if(!addresses.includes(val)){addresses.push(val);el.value="";fetchAll();}}
function removeToken(addr){addresses=addresses.filter(a=>a!==addr);fetchAll();}
async function fetchAll(){const list=document.getElementById("list");if(addresses.length===0){list.innerHTML=`<div class="empty">No tokens yet — paste a contract address above.</div>`;document.getElementById("footerCount").textContent="";return;}try{const results=await Promise.all(addresses.map(async addr=>{try{const res=await fetch(`https://api.dexscreener.com/latest/dex/tokens/${addr}`);if(!res.ok)return{addr,error:true};const data=await res.json();if(!data.pairs||data.pairs.length===0)return{addr,error:true};const pair=data.pairs.reduce((best,p)=>(p.liquidity?.usd||0)>(best.liquidity?.usd||0)?p:best);return{addr,pair};}catch(e){return{addr,error:true};}}));
const sortValue=r=>{if(!r.pair)return null;const p=r.pair;if(sortKey==="price")return parseFloat(p.priceUsd)||0;if(sortKey==="h24")return p.priceChange?.h24??-Infinity;if(sortKey==="liq")return p.liquidity?.usd||0;if(sortKey==="vol")return p.volume?.h24||0;if(sortKey==="mcap")return p.fdv||p.marketCap||0;return null;};
let ordered=results;if(sortKey)ordered=[...results].sort((a,b)=>{if(a.error&&!b.error)return 1;if(b.error&&!a.error)return-1;if(a.error&&b.error)return 0;const av=sortValue(a),bv=sortValue(b);return sortDir==="desc"?bv-av:av-bv;});
list.innerHTML=ordered.map(r=>{if(r.error)return `<div class="row"><div class="top"><div class="id"><div class="icon">?</div><div class="names"><div class="sym">${r.addr.slice(0,6)}…${r.addr.slice(-4)}</div><div class="full">No pair found</div></div></div><button class="remove" style="display:block" onclick="removeToken('${r.addr}')">✕</button></div></div>`;const p=r.pair,sym=p.baseToken.symbol,name=p.baseToken.name,price=parseFloat(p.priceUsd),h1=p.priceChange?.h1,h24=p.priceChange?.h24,liq=p.liquidity?.usd,vol=p.volume?.h24,mcap=p.fdv||p.marketCap,icon=p.info?.imageUrl,rowId="r_"+r.addr.replace(/[^a-zA-Z0-9]/g,"");const cached30=d30Cache[r.addr],d30Html=cached30?(cached30.value!==null?`${fmtDelta(cached30.value)} (${fmtMultiplier(cached30.value)})`:`<span class="flat">n/a</span>`):`<span class="flat">…</span>`;const cachedTrades=tradesCache[p.pairAddress],tradesHtml=cachedTrades?renderTrades(cachedTrades.value):"";return `<div class="row" onclick="window.open('${p.url}','_blank')" style="cursor:pointer"><div class="top"><div class="id"><div class="icon">${icon?`<img src="${icon}">`:sym.slice(0,2)}</div><div class="names"><div class="sym">${sym}</div><div class="full">${name}</div></div></div><div class="price-block"><div class="price">${fmtUsd(price)}</div><div class="deltas">5M ${fmtDelta(p.priceChange?.m5)} · 1H ${fmtDelta(h1)} · 6H ${fmtDelta(p.priceChange?.h6)} · 24H ${fmtDelta(h24)}</div><div class="deltas">30D <span id="d30_${rowId}">${d30Html}</span></div></div><button class="remove" onclick="event.stopPropagation();removeToken('${r.addr}')">✕</button></div><div class="pills"><div class="pill">LIQ <b>${fmtCompact(liq)}</b></div><div class="pill">VOL <b>${fmtCompact(vol)}</b></div><div class="pill">MCAP <b>${fmtCompact(mcap)}</b></div></div><span id="trades_${rowId}">${tradesHtml}</span></div>`;}).join("");
document.getElementById("footerCount").textContent=`Showing ${results.length} pair${results.length!==1?"s":""}`;document.getElementById("lastUpdate").textContent=new Date().toLocaleTimeString();
results.forEach(async r=>{if(r.error)return;const p=r.pair;const rowId="r_"+r.addr.replace(/[^a-zA-Z0-9]/g,"");const d30=await get30dChange(p.chainId,r.addr);const d30El=document.getElementById(`d30_${rowId}`);if(d30El){d30El.innerHTML=d30!==null?`${fmtDelta(d30)} (${fmtMultiplier(d30)})`:`<span class="flat">n/a</span>`;}const trades=await getBigTrades(p.chainId,p.pairAddress);const tradesEl=document.getElementById(`trades_${rowId}`);if(tradesEl)tradesEl.innerHTML=renderTrades(trades);});
}catch(e){list.innerHTML=`<div class="empty">Unable to load data right now.</div>`;}}
renderSortRow();fetchAll();setInterval(fetchAll,10000);
</script>
</body>
</html>
