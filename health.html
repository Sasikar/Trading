<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070a0f">
<title>Health</title>
<style>
  body{margin:0;background:#070a0f;color:#f4f7fb;font-family:Inter,system-ui,sans-serif}
  main{width:min(720px,calc(100% - 20px));margin:8px auto 48px}
  h1{margin:8px 0 4px;font-size:26px;letter-spacing:-.03em}
  #hl-drop{margin:0 0 16px;padding:14px;border-radius:18px;background:#10161f}
  #hl-drop h2{margin:0 0 6px;font-size:16px}
  #hl-drop p{margin:0;color:#8b95a5;font-size:13px;line-height:1.4}
  #hl-link{display:flex;gap:8px;margin:12px 0}
  #hl-url{flex:1;min-width:0;padding:12px 14px;border:0;border-radius:14px;background:#141c27;color:#f4f7fb;font-size:16px;font-weight:700}
  #hl-link button,.hl-upload{border:0;border-radius:14px;padding:12px 14px;background:#e6c878;color:#1a1406;font-weight:900;cursor:pointer}
  .hl-upload{display:block;text-align:center}
  #hl-drop-status{margin-top:10px;font-weight:750}
</style>
</head>
<body>
<main>
  <h1>Health</h1>
  <p class="sub">One list per topic. Words stay saved.</p>
  <section id="hl-drop">
    <h2>Drop a tip</h2>
    <p>A photo is read as a picture. A video is heard with Cloudflare speech-to-text, then filed into the matching topic. A link uses the title and description.</p>
    <form id="hl-link">
      <input id="hl-url" type="url" inputmode="url" placeholder="Paste a video or article link" autocomplete="off">
      <button type="submit">Read link</button>
    </form>
    <label class="hl-upload">Upload photo or video
      <input id="hl-file" type="file" accept="image/*,video/*" multiple hidden>
    </label>
    <p id="hl-drop-status"></p>
  </section>
  <div id="hl-app"></div>
</main>
<script src="health-tab.js?v=20261003-hl4"></script>
<script src="site-nav.js?v=20261003-hl1"></script>
</body>
</html>
