<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a0f"><title>TRADING — BTC ETF Flows</title><style>:root{--bg:#070a0f;--panel:#0d151e;--line:#263341;--text:#f4f7fb;--muted:#7f8c9b;--green:#62e3a0;--red:#ff6262}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.shell{width:min(1100px,calc(100% - 28px));margin:auto}.box{margin:24px 0 34px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#121b25,#090d13);overflow:hidden}.head{padding:18px 20px;border-bottom:1px solid #ffffff0d;display:flex;justify-content:space-between;align-items:center}.title{font-size:18px;font-weight:900}.sub{font-size:11px;color:var(--muted);margin-top:5px}.live{color:var(--green);font-size:10px;font-weight:900;border:1px solid #62e3a033;border-radius:999px;padding:8px 10px}.chart-wrap{padding:16px}.ranges{display:flex;gap:8px;margin-bottom:12px}.ranges button{background:#0b1118;color:#8995a4;border:1px solid #ffffff14;border-radius:9px;padding:8px 12px;font-weight:900}.ranges button.active{color:var(--green);background:#10231d;border-color:#62e3a044}.stat{margin-left:auto;align-self:center;font-size:12px;font-weight:800}.chart{width:100%;height:470px;background:#080d13;border-radius:16px;border:1px solid #ffffff0b}.note{padding:12px 16px 16px;color:#647181;font-size:10px;border-top:1px solid #ffffff0d}@media(max-width:650px){.chart{height:460px}.title{font-size:15px}.sub{font-size:9px}.stat{font-size:10px}}</style></head><body><main class="shell"><section class="box"><div class="head"><div><div class="title">₿ BTC ETF Flows — Live</div><div class="sub">U.S. spot Bitcoin ETF aggregate daily net inflows / outflows</div></div><span class="live">LIVE DATA</span></div><div class="chart-wrap"><div class="ranges"><button class="active" data-days="30">30D</button><button data-days="90">90D</button><button data-days="180">180D</button><span id="stat" class="stat">Loading…</span></div><div id="mount"></div></div><div class="note">Native custom render · no iframe · local JSON · newest 6 sessions highlighted. Source: Farside Investors.</div></section></main><script>const seed=[['2026-08-18',189.3],['2026-08-19',517.2],['2026-08-20',606.3],['2026-08-21',307.5],['2026-08-24',337.6]];let all=seed;const money=n=>Math.abs(n)>=1000?'$'+(n/1000).toFixed(2)+'B':'$'+Math.round(Math.abs(n))+'M';function draw(days){const rows=all.slice(-days),w=1200,h=470,p={l:64,r:24,t:30,b:52},vals=rows.map(r=>+r[1]),max=Math.max(100,...vals.map(v=>Math.abs(v))),ph=h-p.t-p.b,y0=p.t+ph/2,scale=ph/(2*max),slot=(w-p.l-p.r)/Math.max(rows.length,1),bw=Math.max(5,Math.min(30,slot*.62));let s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><rect width="1200" height="470" rx="16" fill="#080d13"/>';for(let i=0;i<=4;i++){let y=p.t+i*ph/4,val=max-i*max/2;s+='<line x1="'+p.l+'" y1="'+y+'" x2="'+(w-p.r)+'" y2="'+y+'" stroke="#fff" stroke-opacity=".055"/><text x="12" y="'+(y+5)+'" fill="#73808e" font-size="13">'+(val===0?'$0':'$'+Math.round(Math.abs(val))+'M')+'</text>'}s+='<line x1="'+p.l+'" y1="'+y0+'" x2="'+(w-p.r)+'" y2="'+y0+'" stroke="#9aa6b4" stroke-opacity=".65"/>';const hi=Math.max(0,rows.length-6);s+='<rect x="'+(p.l+hi*slot-6)+'" y="'+p.t+'" width="'+((rows.length-hi)*slot+10)+'" height="'+ph+'" rx="10" fill="#62e3a0" fill-opacity=".035" stroke="#62e3a0" stroke-opacity=".14"/>';rows.forEach((r,i)=>{let v=+r[1],x=p.l+(i+.5)*slot,bh=Math.max(2,Math.abs(v)*scale),y=v>=0?y0-bh:y0,fill=v>=0?'#62e3a0':'#ff6262';s+='<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+fill+'"><title>'+r[0]+' · '+(v>=0?'+':'')+v.toFixed(1)+'M</title></rect>';if(i===0||i===rows.length-1||i%Math.max(1,Math.ceil(rows.length/7))===0)s+='<text x="'+x+'" y="'+(h-17)+'" text-anchor="middle" fill="#74808e" font-size="12">'+r[0].slice(5)+'</text>'});let recent=rows.slice(-6).reduce((a,r)=>a+ +r[1],0);s+='<text x="'+(w-p.r-4)+'" y="'+(p.t+17)+'" text-anchor="end" fill="#62e3a0" font-size="15" font-weight="900">LAST 6D '+(recent>=0?'+':'')+money(recent)+'</text></svg>';document.getElementById('mount').innerHTML=s;document.getElementById('stat').innerHTML='Last 6D <b style="color:var(--green)">'+(recent>=0?'+':'')+money(recent)+'</b>'}function load(){draw(30);fetch('./etf-flows.json?build=20260825-v2',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.data)&&j.data.length){all=j.data;draw(+document.querySelector('.ranges .active').dataset.days)}}).catch(()=>{})}load();document.querySelectorAll('.ranges button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ranges button').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(+b.dataset.days)});</script>  <script src="site-nav.js"></script>
</body></html>
