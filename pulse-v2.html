<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a0f"><title>TRADING — BTC ETF Flows</title><style>:root{--bg:#070a0f;--panel:#0d151e;--line:#263341;--text:#f4f7fb;--muted:#7f8c9b;--green:#62e3a0;--red:#ff6262;--gold:#f3d36b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.shell{width:min(1100px,calc(100% - 28px));margin:auto}.box{margin:24px 0 34px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#121b25,#090d13);overflow:hidden}.head{padding:18px 20px;border-bottom:1px solid #ffffff0d;display:flex;justify-content:space-between;align-items:center}.title{font-size:18px;font-weight:900}.sub{font-size:11px;color:var(--muted);margin-top:5px}.live{color:var(--green);font-size:10px;font-weight:900;border:1px solid #62e3a033;border-radius:999px;padding:8px 10px}.chart-wrap{padding:14px 16px 16px}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}.ranges{display:flex;gap:6px}.ranges button{background:#0a1017;color:#8995a4;border:1px solid #ffffff12;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900}.ranges button.active{color:#07100b;background:var(--green);border-color:var(--green)}.stat{margin-left:auto;font-size:11px;color:#8793a1;font-weight:800}.stat b{color:var(--green)}.chart{width:100%;height:390px;display:block;background:#020507;border-radius:14px;border:1px solid #ffffff08}.note{padding:11px 16px 15px;color:#647181;font-size:10px;border-top:1px solid #ffffff0d}.note b{color:#8c98a6}@media(max-width:650px){.chart{height:370px}.title{font-size:15px}.sub{font-size:9px}.stat{font-size:10px}.ranges button{padding:7px 10px;font-size:10px}.chart-wrap{padding:12px 10px 14px}}</style></head><body><main class="shell"><section class="box"><div class="head"><div><div class="title">₿ BTC ETF Flows — Live</div><div class="sub">U.S. spot Bitcoin ETF aggregate daily net inflows / outflows</div></div><span class="live">LIVE DATA</span></div><div class="chart-wrap"><div class="toolbar"><div class="ranges"><button class="active" data-days="30">30D</button><button data-days="90">90D</button><button data-days="180">180D</button></div><span id="stat" class="stat">Loading…</span></div><div id="mount"></div></div><div class="note">Custom native render · <b>green = net inflow</b> · <b style="color:var(--red)">red = net outflow</b> · newest 6 sessions highlighted · Source: Farside Investors.</div></section></main><script>const seed=[['2026-08-18',189.3],['2026-08-19',517.2],['2026-08-20',606.3],['2026-08-21',307.5],['2026-08-24',337.6]];let all=seed;const fmt=n=>Math.abs(n)>=1000?'$'+(n/1000).toFixed(2)+'B':'$'+Math.round(Math.abs(n))+'M';const dateLabel=d=>{const p=d.slice(5).split('-');return p[0]+'/'+p[1]};function draw(days){const rows=all.slice(-days),w=1200,h=390,p={l:60,r:20,t:24,b:42},ph=h-p.t-p.b,vals=rows.map(r=>+r[1]),max=Math.max(100,...vals.map(v=>Math.abs(v))),y0=p.t+ph/2,scale=ph/(2*max),slot=(w-p.l-p.r)/Math.max(rows.length,1),bw=Math.max(4,Math.min(28,slot*.66));let s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Bitcoin ETF daily net flows chart"><rect width="1200" height="390" fill="#020507" rx="14"/>';for(let i=0;i<=4;i++){const y=p.t+i*ph/4,val=max-i*max/2;s+='<line x1="'+p.l+'" y1="'+y+'" x2="'+(w-p.r)+'" y2="'+y+'" stroke="#dce7f0" stroke-opacity=".075" stroke-width="1"/><text x="10" y="'+(y+5)+'" fill="#66727f" font-size="13">'+(val===0?'$0':'$'+Math.round(Math.abs(val))+'M')+'</text>'}s+='<line x1="'+p.l+'" y1="'+y0+'" x2="'+(w-p.r)+'" y2="'+y0+'" stroke="#9aa6b4" stroke-opacity=".7" stroke-width="1.5"/>';const hi=Math.max(0,rows.length-6);if(rows.length>6){const hx=p.l+hi*slot+2,hw=(rows.length-hi)*slot-4;s+='<rect x="'+hx+'" y="'+(p.t+2)+'" width="'+hw+'" height="'+(ph-4)+'" rx="5" fill="none" stroke="'+getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()+'" stroke-opacity=".55" stroke-width="2"/>'}rows.forEach((r,i)=>{const v=+r[1],x=p.l+(i+.5)*slot,bh=Math.max(2,Math.abs(v)*scale),y=v>=0?y0-bh:y0,fill=v>=0?'#42df94':'#ff4d5e';s+='<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="2" fill="'+fill+'"/><rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.min(2,bh)+'" rx="1" fill="#ffffff" fill-opacity=".12"/><title>'+r[0]+' · '+(v>=0?'+':'')+v.toFixed(1)+'M</title>';const step=Math.max(1,Math.ceil(rows.length/7));if(i===0||i===rows.length-1||i%step===0)s+='<text x="'+x+'" y="'+(h-15)+'" text-anchor="middle" fill="#6f7b88" font-size="12">'+dateLabel(r[0])+'</text>'});const recent=rows.slice(-6).reduce((a,r)=>a+ +r[1],0),recentText=(recent>=0?'+':'')+fmt(recent);s+='<text x="'+(w-p.r-4)+'" y="'+(p.t+15)+'" text-anchor="end" fill="#f3d36b" font-size="14" font-weight="900">LAST 6D '+recentText+'</text></svg>';document.getElementById('mount').innerHTML=s;document.getElementById('stat').innerHTML='Last 6D <b>'+(recent>=0?'+':'')+fmt(recent)+'</b>'}function load(){draw(30);fetch('./etf-flows.json?build=20260825-v3',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.data)&&j.data.length){all=j.data;draw(+document.querySelector('.ranges .active').dataset.days)}}).catch(()=>{})}load();document.querySelectorAll('.ranges button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ranges button').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(+b.dataset.days)});</script><script src="site-nav.js?build=20260825-v3"></script>  <script src="site-nav.js"></script>
</body></html>
