<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koinly Live Sync</title><style>body{margin:0;background:#070a0f;color:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px}.card{background:#101821;border:1px solid #263341;border-radius:18px;padding:20px;margin:14px 0}.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:800;background:#62e3a0;color:#06120b}.btn:disabled{opacity:.5}.muted{color:#8491a1;font-size:13px;line-height:1.6}a{color:#62e3a0}.status{white-space:pre-wrap;font-size:13px}.rows{max-height:420px;overflow:auto}.row{border-bottom:1px solid #263341;padding:10px 0;font-size:12px}.diag{margin-top:10px;padding:10px;border:1px solid #394858;border-radius:10px;background:#0a0f15;color:#cbd5e1;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow:auto}</style></head><body><div class="wrap"><h1>Koinly Live Sync</h1><p class="muted">Manual Google login once. The browser session is retained on Cloudflare; Sync reuses it until Koinly expires it.</p><div class="card"><button id="login" class="btn">1 · Connect Koinly</button> <button id="complete" class="btn" disabled>2 · Complete Login</button> <button id="sync" class="btn" disabled>3 · Sync Latest</button><div id="status" class="status muted" style="margin-top:16px">Ready.</div><div id="diag" class="diag" style="display:none"></div></div><div class="card"><h3>Latest stored transactions</h3><div id="rows" class="rows muted">No sync yet.</div></div></div><script>const API='https://trading-koinly-worker.sasipudi.workers.dev';let token=localStorage.getItem('koinly_login_token')||'';const $=id=>document.getElementById(id);function show(x){$('status').textContent=x}function diagnostics(x){const d=$('diag');d.style.display='block';d.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function headers(){return {'x-login-token':token,'content-type':'application/json'}}async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...headers(),...(opts.headers||{})}});const d=await r.json().catch(()=>({status:'invalid_json'}));if(!r.ok){const retry=r.headers.get('retry-after');const detail={http_status:r.status,response_status:d.status||null,message:d.message||null,retry_after_seconds:retry?Number(retry):null,worker_response:d};diagnostics(detail);const e=new Error(d.message||d.status||('HTTP '+r.status));e.httpStatus=r.status;e.retryAfter=retry;throw e}return d}$('login').onclick=async()=>{try{diagnostics('');$('diag').style.display='none';$('login').disabled=true;show('Starting secure Cloudflare browser…');const d=await api('/login');token=d.login_token;localStorage.setItem('koinly_login_token',token);$('complete').disabled=false;show('Open the Live View below, sign in to Koinly with Google, then return here and tap Complete Login.\n\n'+d.live_view_url);window.open(d.live_view_url,'_blank')}catch(e){show('Connect failed: '+e.message+((e.retryAfter)?'\nRetry after: '+e.retryAfter+'s':'')+'\n\nSee the diagnostic box below for the exact Worker response.');setTimeout(()=>{$('login').disabled=false},Math.max(5000,(Number(e.retryAfter)||0)*1000))}};$('complete').onclick=async()=>{try{show('Checking your Koinly login and saving the session…');const d=await api('/complete-login',{method:'POST'});show(d.message||JSON.stringify(d,null,2));$('sync').disabled=false}catch(e){show('Complete Login failed: '+e.message);}};$('sync').onclick=async()=>{try{show('Scraping Koinly transactions…');const d=await api('/sync',{method:'POST'});show(JSON.stringify(d,null,2));if(d.status==='ok')load()}catch(e){show('Sync failed: '+e.message+((e.retryAfter)?'\nRetry after: '+e.retryAfter+'s':''))}};async function load(){try{const rows=await api('/transactions');$('rows').innerHTML=(rows||[]).map(r=>'<div class="row">'+escapeHtml(r.raw_json||'')+'<br><span class="muted">Synced '+escapeHtml(r.synced_at||'')+'</span></div>').join('')||'No stored transactions yet.'}catch(e){$('rows').textContent='Sync once to load transactions.'}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}if(token){$('complete').disabled=false;$('sync').disabled=false;show('Existing session token found. Try Sync first.')}load();</script><script src="site-nav.js"></script></body></html>
