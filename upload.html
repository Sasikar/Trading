<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload to Trading</title>
<style>
  :root {
    --bg: #0d0e12;
    --card: #15161c;
    --line: #24252c;
    --text: #f2f2f4;
    --dim: #8b8d98;
    --green: #3ecf8e;
    --red: #f2545b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  input[type=password], input[type=text] {
    width: 100%;
    background: #0d0e12;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
  }
  .drop {
    border: 2px dashed var(--line);
    border-radius: 14px;
    padding: 40px 16px;
    text-align: center;
    color: var(--dim);
    cursor: pointer;
    transition: 0.15s;
  }
  .drop.dragover { border-color: var(--green); background: rgba(62,207,142,0.05); }
  .drop strong { color: var(--text); }
  button {
    background: var(--green);
    color: #052;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    margin-top: 12px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 13px; margin-top: 10px; min-height: 20px; }
  .ok { color: var(--green); }
  .err { color: var(--red); }
  .file-list { margin-top: 12px; font-size: 13px; }
  .file-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .file-item a { color: var(--green); text-decoration: none; }
  .nav { margin-bottom: 18px; }
  .nav a { color: var(--dim); font-size: 13px; text-decoration: none; margin-right: 14px; }
  .nav a:hover { color: var(--green); }
  .token-row { display: flex; gap: 8px; }
  .token-row input { flex: 1; }
  .token-row button { width: auto; margin-top: 0; padding: 0 14px; }
</style>
</head>
<body>

  <div class="nav">
    <a href="index.html">← Hub</a>
    <a href="watchlist.html">Watchlist</a>
    <a href="pre-entry-checklist.html">Checklist</a>
  </div>

  <h1>Upload Files</h1>
  <p class="sub">Files are committed directly into your Trading repo.</p>

  <div class="card">
    <label>GitHub Token (fine-grained, Contents: Read & write)</label>
    <div class="token-row">
      <input type="password" id="token" placeholder="github_pat_..." autocomplete="off">
      <button type="button" onclick="saveToken()">Save</button>
    </div>
    <div class="status" id="tokenStatus"></div>
  </div>

  <div class="card">
    <div class="drop" id="dropZone">
      <strong>Drop files here</strong><br>
      or click to choose<br>
      <span style="font-size:12px">Images, HTML, PDF, etc.</span>
    </div>
    <input type="file" id="fileInput" multiple style="display:none">
    <div class="status" id="uploadStatus"></div>
  </div>

  <div class="card">
    <label>Files currently in repo</label>
    <div class="file-list" id="fileList">Loading…</div>
  </div>

<script>
const OWNER = "Sasikar";
const REPO  = "Trading";
const BRANCH = "master";

function getToken() {
  return localStorage.getItem("gh_upload_token") || "";
}

function saveToken() {
  const t = document.getElementById("token").value.trim();
  if (!t) {
    document.getElementById("tokenStatus").innerHTML = '<span class="err">Paste a token first</span>';
    return;
  }
  localStorage.setItem("gh_upload_token", t);
  document.getElementById("tokenStatus").innerHTML = '<span class="ok">Token saved in this browser only</span>';
  document.getElementById("token").value = "";
  loadFiles();
}

// Load saved token indicator
(function(){
  if (getToken()) {
    document.getElementById("tokenStatus").innerHTML = '<span class="ok">Token already saved</span>';
  }
})();

const drop = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("dragover"); });
drop.addEventListener("dragleave", () => drop.classList.remove("dragover"));
drop.addEventListener("drop", e => {
  e.preventDefault();
  drop.classList.remove("dragover");
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener("change", () => handleFiles(fileInput.files));

async function handleFiles(fileList) {
  const token = getToken();
  if (!token) {
    document.getElementById("uploadStatus").innerHTML = '<span class="err">Save a GitHub token first</span>';
    return;
  }

  const files = Array.from(fileList);
  if (files.length === 0) return;

  document.getElementById("uploadStatus").textContent = `Uploading ${files.length} file(s)…`;

  for (const file of files) {
    try {
      await uploadFile(file, token);
      document.getElementById("uploadStatus").innerHTML = `<span class="ok">Uploaded: ${file.name}</span>`;
    } catch (err) {
      document.getElementById("uploadStatus").innerHTML = `<span class="err">Failed ${file.name}: ${err.message}</span>`;
      console.error(err);
    }
  }
  loadFiles();
}

async function uploadFile(file, token) {
  const content = await readAsBase64(file);
  const path = file.name; // put in root for simplicity

  // Check if file already exists (need sha for update)
  let sha = null;
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`, {
      headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
    });
    if (res.ok) {
      const data = await res.json();
      sha = data.sha;
    }
  } catch (_) {}

  const body = {
    message: `Upload ${file.name}`,
    content: content,
    branch: BRANCH
  };
  if (sha) body.sha = sha;

  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || res.statusText);
  }
}

function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      // remove data:*/*;base64, prefix
      resolve(result.split(",")[1]);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadFiles() {
  const list = document.getElementById("fileList");
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`);
    if (!res.ok) throw new Error("Could not list files");
    const data = await res.json();
    const files = data.filter(f => f.type === "file");
    if (files.length === 0) {
      list.innerHTML = "No files yet";
      return;
    }
    list.innerHTML = files.map(f => `
      <div class="file-item">
        <a href="${f.name}" target="_blank">${f.name}</a>
        <span style="color:var(--dim)">${(f.size/1024).toFixed(1)} KB</span>
      </div>
    `).join("");
  } catch (e) {
    list.innerHTML = `<span class="err">${e.message}</span>`;
  }
}

loadFiles();
</script>
</body>
</html>
