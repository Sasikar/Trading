<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>FomoEntry</title>
<style>
:root{--bg:#070a0f;--text:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.shell{width:min(480px,calc(100% - 20px));margin:auto;padding:14px 0 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.brand{font-weight:900;letter-spacing:.14em;font-size:14px}
.brand i{color:#62e3a0;font-style:normal}
.section{padding:8px 0}
.fe-lab{font-size:10px;letter-spacing:.16em;font-weight:800;color:#6d7688;margin:0 2px 6px}
.fe-search,.fe-drop{width:100%;display:flex;align-items:center;gap:10px;min-height:48px;border-radius:16px;border:1px solid #2a3342;background:#10151c;color:#f4f7fb}
.fe-search{padding:0 14px}
.fe-search input{flex:1;min-width:0;border:0;background:transparent;color:#f4f7fb;font:inherit;font-weight:700;font-size:15px;outline:none}
.fe-search input::placeholder{color:#6d7688;font-weight:600}
.fe-search:focus-within{border-color:#e6b84d;box-shadow:0 0 0 3px #e6b84d22}
.fe-drop{padding:6px 12px;text-align:left;cursor:pointer}
.fe-menu{margin-top:8px;border:1px solid #2a3342;background:#0c1117;border-radius:16px;max-height:280px;overflow:auto;box-shadow:0 18px 40px #000c}
.fe-row{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;border-bottom:1px solid #1c2430;background:transparent;color:#f4f7fb;text-align:left;cursor:pointer}
.fe-row:last-child{border-bottom:0}
.fe-row.on{background:#1c1810}
.fe-ava{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;background:#1a2230;color:#e6b84d;font-weight:900;font-size:12px;flex:none}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div class="brand">FOMOENTRY<i>.</i></div></div>
  <div id="fe-panel">
    <section class="section">
      <div id="fe-board"></div>
      <span id="fe-status" style="display:none">WAIT</span>
    </section>
  </div>
</div>
<script type="module" src="fomoentry-tab.mjs?v=20260928-shelf"></script>
<script type="module">
  if (window.showFomoEntryDesk) window.showFomoEntryDesk(true);
</script>
</body>
</html>
